# Web service only. MySQL stays outside Render because this app uses MySQL
# and Render's managed database is PostgreSQL. Secrets are not stored here:
# AUTH_SECRET is generated on first Blueprint sync, and database values are
# entered in the Render Dashboard.
services:
  - type: web
    name: tapiz-boards
    runtime: node
    plan: free
    branch: main
    # This repo gitignores package-lock.json, so npm ci cannot run on Render.
    buildCommand: npm install && npm run build
    startCommand: npm start
    # /api/health queries MySQL and returns 503 when the database is down.
    # Render treats that as a failed deploy (it needs 2xx/3xx within 5s),
    # so the probe stays on the process-only liveness route.
    healthCheckPath: /api/live
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        fromService:
          name: tapiz-boards
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          name: tapiz-boards
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA_BASE64
        sync: false
